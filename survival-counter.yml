name: Survival Day Counter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Calculate Days Survived
        id: counter
        run: |
          START_DATE="2026-01-02"
          CURRENT_DATE=$(date +%Y-%m-%d)
          START_SEC=$(date -d "$START_DATE" +%s)
          CURRENT_SEC=$(date -d "$CURRENT_DATE" +%s)
          DAYS=$(( (CURRENT_SEC - START_SEC) / 86400 ))
          echo "DAYS_SURVIVED=$DAYS" >> $GITHUB_ENV

      - name: Update README Log
        run: |
          sed -i "s/DIAS_SOBREVIVENDO.*/DIAS_SOBREVIVENDO: ${{ env.DAYS_SURVIVED }} dias/g" README.md || true

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "☣️ Log de sobrevivência atualizado: Dia ${{ env.DAYS_SURVIVED }}"
          git push
